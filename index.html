<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan Trip — LEGO's 30th</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#bc002d">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --card: #ffffff;
    --line: #ecdcdc;
    --ink: #1c1414;
    --ink-muted: #7d6c6c;
    --ink-faint: #ad9797;
    --red: #bc002d;
    --red-dark: #8f0022;
    --red-tint: #fdf1f2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding:18px 14px 40px;
  }
  .wrap{max-width:640px; margin:0 auto;}

  .header{position:relative; padding:22px 4px 24px; border-bottom:1px solid var(--line); margin-bottom:16px; text-align:center; overflow:hidden;}
  .disc{
    position:absolute; top:-46px; left:50%; transform:translateX(-50%);
    width:150px; height:150px; border-radius:50%; background:var(--red); opacity:.09;
  }
  .eyebrow{position:relative; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--ink-faint); text-transform:uppercase;}
  h1{position:relative; font-family:'Shippori Mincho', serif; font-weight:700; font-size:26px; margin:10px 0 8px; color:var(--red); line-height:1.25;}
  .sub{position:relative; font-size:13px; color:var(--ink-muted);}

  .page-toggle{display:flex; gap:6px; margin-bottom:16px; background:var(--red-tint); border:1px solid var(--line); border-radius:10px; padding:4px;}
  .page-btn{
    flex:1; text-align:center; padding:9px 6px; border-radius:7px; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-muted); transition:background .15s ease, color .15s ease;
  }
  .page-btn.active{background:var(--red); color:#fff;}

  .page{display:none;}
  .page.active{display:block;}

  .tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; position:relative; background:#fff; border:1px solid var(--line);
    border-radius:8px; padding:9px 12px 10px; cursor:pointer; min-width:64px; text-align:center;
    transition:transform .15s ease, border-color .15s ease;
  }
  .tab::after{content:''; position:absolute; left:50%; bottom:-5px; transform:translateX(-50%); width:9px; height:9px; border-radius:50%; background:var(--bg); border:1px solid var(--line);}
  .tab .dow{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-faint); letter-spacing:.08em;}
  .tab .dt{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; color:var(--ink); margin-top:2px;}
  .tab .dot{width:16px; height:3px; border-radius:2px; margin:6px auto 0; background:var(--line);}
  .tab.active{border-color:var(--red); transform:translateY(-2px); box-shadow:0 6px 14px rgba(188,0,45,.12);}
  .tab.active .dt{color:var(--red);}
  .tab.active .dot{background:var(--red);}

  .cat-tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 16px; scrollbar-width:none;}
  .cat-tabs::-webkit-scrollbar{display:none;}
  .cat-tab{
    flex:0 0 auto; background:#fff; border:1px solid var(--line); border-radius:20px;
    padding:9px 14px; cursor:pointer; font-size:13px; font-weight:500; color:var(--ink-muted);
    transition:border-color .15s ease, color .15s ease;
  }
  .cat-tab.active{border-color:var(--red); color:var(--red); background:var(--red-tint);}
  .cat-tab.add-new{border-style:dashed; color:var(--red);}

  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .day-title-row{display:flex; align-items:baseline; justify-content:space-between; margin:2px 2px 14px;}
  .day-city{font-family:'Shippori Mincho', serif; font-size:19px; font-weight:700; color:var(--ink);}
  .day-date{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-faint);}

  .section-label-row{display:flex; align-items:center; gap:8px; margin:20px 2px 10px;}
  .section-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); flex:1;}
  .section-line{flex:1; height:1px; background:var(--line);}
  .mini-btn{background:none; border:none; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:10.5px; cursor:pointer; padding:2px 4px;}
  .mini-btn:hover{color:var(--red);}

  .flex-note{font-size:12.5px; color:var(--ink-muted); background:var(--red-tint); border:1px dashed var(--red); border-radius:8px; padding:9px 11px; margin:2px 2px 16px; line-height:1.5;}

  .spot{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 14px 12px; margin-bottom:10px; position:relative; border-left:3px solid var(--red);}
  .spot-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .spot-name{font-weight:700; font-size:15.5px; color:var(--ink); line-height:1.3;}
  .spot-name.stamped{color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:1.5px;}
  .spot-note{font-size:13px; color:var(--ink-muted); margin-top:4px; line-height:1.45;}
  .spot-addr{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-top:8px; line-height:1.4;}
  .spot-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:11px; gap:8px;}
  .maps-btn{display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--red); color:var(--red); font-family:'Zen Kaku Gothic New',sans-serif; font-weight:500; font-size:12.5px; padding:7px 12px; border-radius:20px; text-decoration:none; cursor:pointer;}
  .maps-btn:active{background:var(--red-tint);}
  .icon-btns{display:flex; gap:4px; flex-shrink:0;}
  .icon-btn{background:none; border:1px solid var(--line); color:var(--ink-muted); font-size:11px; cursor:pointer; font-family:'IBM Plex Mono',monospace; padding:6px 9px; border-radius:14px;}
  .icon-btn:hover{border-color:var(--red); color:var(--red);}
  .icon-btn.danger.confirming{background:var(--red); border-color:var(--red); color:#fff;}

  .stamp{width:34px; height:34px; border-radius:50%; border:2px solid var(--ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; background:transparent; transition:transform .18s ease, border-color .18s ease;}
  .stamp svg{width:16px; height:16px; opacity:0;}
  .stamp.on{border-color:var(--red); background:var(--red-tint); transform:rotate(-8deg) scale(1.06);}
  .stamp.on svg{opacity:1;}
  .stamp path{stroke:var(--red); stroke-width:2.4; fill:none;}
  .no-addr{opacity:.55; font-style:italic;}

  .edit-card{background:var(--red-tint); border:1px solid var(--red); border-radius:10px; padding:14px; margin-bottom:10px;}
  .edit-card input, .edit-card textarea{
    width:100%; background:#fff; border:1px solid var(--line); border-radius:6px;
    color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; font-size:13px; padding:9px 10px; margin-bottom:8px;
  }
  .edit-card textarea{resize:vertical; min-height:38px;}
  .edit-card .row{display:flex; gap:8px;}
  .edit-card .row button{flex:1;}
  .btn-primary{background:var(--red); border:none; color:#fff; font-weight:700; font-size:13px; padding:9px; border-radius:6px; cursor:pointer;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-muted); font-size:13px; padding:9px; border-radius:6px; cursor:pointer;}
  .add-trigger{
    width:100%; background:transparent; border:1px dashed var(--line); color:var(--ink-muted);
    border-radius:10px; padding:12px; font-size:13px; cursor:pointer; margin-bottom:14px; font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .add-trigger:hover{border-color:var(--red); color:var(--red);}
  .empty-state{font-size:13px; color:var(--ink-faint); text-align:center; padding:20px 10px; font-style:italic;}

  .cat-manage{display:flex; align-items:center; gap:8px; margin:2px 2px 16px;}
  .cat-manage .cat-heading{font-family:'Shippori Mincho', serif; font-size:18px; font-weight:700; flex:1;}

  footer{text-align:center; margin-top:26px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); letter-spacing:.06em;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCSW2sK381qM4Uh9k9us17M6pQwBJcR-BM",
  authDomain: "japan-trip-2026-legod.firebaseapp.com",
  projectId: "japan-trip-2026-legod",
  storageBucket: "japan-trip-2026-legod.firebasestorage.app",
  messagingSenderId: "310847158928",
  appId: "1:310847158928:web:338a793b32fcae78527615"
};
let firebaseOK = true;
let db, tripDocRef;
try{
  if(typeof firebase === 'undefined') throw new Error('Firebase SDK did not load');
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  tripDocRef = db.collection('trips').doc('japan2026');
}catch(e){
  firebaseOK = false;
}

let remoteData = {};
let currentPage = 'hotels';
let currentDayIdx = 0;

const STORAGE = {
  async get(key){
    if(firebaseOK){
      if(Object.prototype.hasOwnProperty.call(remoteData, key)) return { value: remoteData[key] };
      throw new Error('not found');
    }
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return { value: v };
  },
  async set(key, value){
    if(firebaseOK){
      remoteData[key] = value;
      try{ await tripDocRef.set({ data: { [key]: value } }, { merge: true }); }catch(e){}
    } else {
      localStorage.setItem(key, value);
    }
    return { value };
  }
};

function showSyncWarning(){
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#fdf1f2;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.4;';
  banner.textContent = 'Running in offline/unsynced mode — the shared connection was blocked (often an ad blocker or privacy browser setting). Your edits are only saving on this device. Try disabling content blockers for this site and reloading.';
  document.querySelector('.wrap').insertBefore(banner, document.querySelector('.page-toggle'));
}

async function rerenderCurrent(){
  if(currentPage === 'hotels'){
    renderHotels();
  } else if(currentPage === 'itinerary'){
    const panel = document.querySelectorAll('.panel')[currentDayIdx];
    if(panel) renderDayPanel(panel, currentDayIdx);
  } else if(currentPage === 'places'){
    categories = await getStore('places:categories', DEFAULT_CATEGORIES);
    renderCatTabs();
    renderCatPanel();
  }
}

async function initFirebase(){
  if(!firebaseOK){ showSyncWarning(); return; }
  try{
    const snap = await tripDocRef.get();
    remoteData = (snap.exists && snap.data().data) ? snap.data().data : {};
    if(!snap.exists){ await tripDocRef.set({ data: {} }); }
    tripDocRef.onSnapshot(snap => {
      if(snap.metadata.hasPendingWrites) return;
      remoteData = (snap.exists && snap.data().data) ? snap.data().data : {};
      rerenderCurrent();
    });
  }catch(e){
    firebaseOK = false;
    remoteData = {};
    showSyncWarning();
  }
}
function uid(){ return 'id_' + Math.random().toString(36).slice(2, 10); }
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid(); }

async function getStore(key, seedValue){
  try{
    const res = await STORAGE.get(key, false);
    if(res && res.value !== undefined) return JSON.parse(res.value);
    throw new Error('empty');
  }catch(e){
    try{ await STORAGE.set(key, JSON.stringify(seedValue), false); }catch(_){}
    return seedValue;
  }
}
async function setStore(key, value){
  try{ await STORAGE.set(key, JSON.stringify(value), false); }catch(e){}
}
function mapsUrl(name, address){
  const q = address ? (name + ", " + address) : name;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

/* ---------- Page toggle ---------- */
document.querySelectorAll('.page-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.page-btn').forEach(b => b.classList.toggle('active', b===btn));
    const target = btn.dataset.page;
    currentPage = target;
    document.getElementById('page-hotels').classList.toggle('active', target==='hotels');
    document.getElementById('page-itinerary').classList.toggle('active', target==='itinerary');
    document.getElementById('page-places').classList.toggle('active', target==='places');
  });
});

/* =========================================================
   GENERIC EDITABLE ITEM CARD (used by Hotels, Places, Spots)
   ========================================================= */
function buildEditableCard(item, opts){
  // opts: { onSave(fields), onDelete(), showStamp, stampOn, onToggleStamp }
  const wrap = document.createElement('div');
  const div = document.createElement('div');
  div.className = 'spot';
  wrap.appendChild(div);

  function renderView(){
    div.style.display = '';
    const hasAddr = !!item.address;
    div.innerHTML = '';
    const top = document.createElement('div');
    top.className = 'spot-top';
    const left = document.createElement('div');
    const nameEl = document.createElement('div');
    nameEl.className = 'spot-name' + (opts.stampOn ? ' stamped' : '');
    nameEl.textContent = item.name;
    const noteEl = document.createElement('div');
    noteEl.className = 'spot-note';
    noteEl.textContent = item.note || '';
    left.appendChild(nameEl); left.appendChild(noteEl);
    top.appendChild(left);

    const rightControls = document.createElement('div');
    rightControls.className = 'icon-btns';
    if(opts.showStamp){
      const stampBtn = document.createElement('div');
      stampBtn.className = 'stamp' + (opts.stampOn ? ' on' : '');
      stampBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12.5 L10 18 L20 6"/></svg>';
      stampBtn.addEventListener('click', () => opts.onToggleStamp());
      top.appendChild(stampBtn);
    } else {
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn'; editBtn.textContent = 'edit';
      editBtn.addEventListener('click', renderEdit);
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger'; delBtn.textContent = 'remove';
      let confirming = false, timer = null;
      delBtn.addEventListener('click', () => {
        if(!confirming){
          confirming = true; delBtn.textContent = 'confirm?'; delBtn.classList.add('confirming');
          timer = setTimeout(() => { confirming = false; delBtn.textContent = 'remove'; delBtn.classList.remove('confirming'); }, 2800);
        } else {
          clearTimeout(timer);
          opts.onDelete();
        }
      });
      rightControls.appendChild(editBtn);
      rightControls.appendChild(delBtn);
      top.appendChild(rightControls);
    }
    div.appendChild(top);

    const addrEl = document.createElement('div');
    addrEl.className = 'spot-addr' + (hasAddr ? '' : ' no-addr');
    addrEl.textContent = hasAddr ? item.address : 'address TBD';
    div.appendChild(addrEl);

    const bottom = document.createElement('div');
    bottom.className = 'spot-bottom';
    if(hasAddr){
      const a = document.createElement('button');
      a.className = 'maps-btn';
      a.textContent = '↳ Get Directions';
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const url = mapsUrl(item.name, item.address);
        const win = window.open(url, '_blank', 'noopener,noreferrer');
        if(!win){ window.location.href = url; }
      });
      bottom.appendChild(a);
    }
    div.appendChild(bottom);
  }

  function renderEdit(){
    div.innerHTML = '';
    div.classList.add('edit-card');
    div.style.borderLeft = 'none';
    const nameI = document.createElement('input'); nameI.type='text'; nameI.value=item.name; nameI.placeholder='Name';
    const addrI = document.createElement('input'); addrI.type='text'; addrI.value=item.address||''; addrI.placeholder='Address';
    const noteI = document.createElement('textarea'); noteI.value=item.note||''; noteI.placeholder='Note';
    div.appendChild(nameI); div.appendChild(addrI); div.appendChild(noteI);
    const row = document.createElement('div'); row.className='row';
    const saveBtn = document.createElement('button'); saveBtn.className='btn-primary'; saveBtn.textContent='Save';
    const cancelBtn = document.createElement('button'); cancelBtn.className='btn-ghost'; cancelBtn.textContent='Cancel';
    row.appendChild(saveBtn); row.appendChild(cancelBtn);
    div.appendChild(row);
    saveBtn.addEventListener('click', () => {
      const name = nameI.value.trim();
      if(!name) return;
      item.name = name; item.address = addrI.value.trim(); item.note = noteI.value.trim();
      opts.onSave({ name: item.name, address: item.address, note: item.note });
      div.classList.remove('edit-card'); div.style.borderLeft='';
      renderView();
    });
    cancelBtn.addEventListener('click', () => { div.classList.remove('edit-card'); div.style.borderLeft=''; renderView(); });
  }

  renderView();
  return wrap;
}

function buildAddForm(containerEl, triggerLabel, onAdd){
  const trigger = document.createElement('button');
  trigger.className = 'add-trigger'; trigger.textContent = triggerLabel;
  const form = document.createElement('div');
  form.className = 'edit-card'; form.style.display = 'none';
  form.innerHTML = '<input type="text" placeholder="Name" data-f-name>' +
    '<input type="text" placeholder="Address" data-f-addr>' +
    '<textarea placeholder="Note (optional)" data-f-note></textarea>' +
    '<div class="row"><button class="btn-primary" data-f-save>Save</button><button class="btn-ghost" data-f-cancel>Cancel</button></div>';
  containerEl.appendChild(trigger);
  containerEl.appendChild(form);
  trigger.addEventListener('click', () => { form.style.display='block'; trigger.style.display='none'; });
  form.querySelector('[data-f-cancel]').addEventListener('click', () => {
    form.style.display='none'; trigger.style.display='block';
    form.querySelectorAll('input,textarea').forEach(el => el.value='');
  });
  form.querySelector('[data-f-save]').addEventListener('click', () => {
    const name = form.querySelector('[data-f-name]').value.trim();
    const address = form.querySelector('[data-f-addr]').value.trim();
    const note = form.querySelector('[data-f-note]').value.trim();
    if(!name) return;
    onAdd({ id: uid(), name, address, note });
    form.querySelectorAll('input,textarea').forEach(el => el.value='');
    form.style.display='none'; trigger.style.display='block';
  });
}

/* =========================================================
   HOTELS PAGE
   ========================================================= */
const HOTELS_SEED = [
  { id:'hotel-tokyo', name:'Tokyo Hotel', note:'Tap edit to fill in the real name, address, and confirmation info.', address:'' },
  { id:'hotel-osaka', name:'Osaka Hotel', note:'Tap edit to fill in the real name, address, and confirmation info.', address:'' }
];
const hotelsListEl = document.getElementById('hotelsList');

async function renderHotels(){
  hotelsListEl.innerHTML = '';
  const hotels = await getStore('hotels', HOTELS_SEED);
  if(hotels.length === 0){
    const empty = document.createElement('div'); empty.className='empty-state';
    empty.textContent = 'No hotels added yet.';
    hotelsListEl.appendChild(empty);
    return;
  }
  hotels.forEach(hotel => {
    hotelsListEl.appendChild(buildEditableCard(hotel, {
      onSave: async (fields) => {
        Object.assign(hotel, fields);
        await setStore('hotels', hotels);
      },
      onDelete: async () => {
        const updated = hotels.filter(h => h.id !== hotel.id);
        await setStore('hotels', updated);
        renderHotels();
      }
    }));
  });
}
document.getElementById('hotelAddTrigger').addEventListener('click', () => {
  document.getElementById('hotelAddForm').style.display = 'block';
  document.getElementById('hotelAddTrigger').style.display = 'none';
});
document.querySelector('#hotelAddForm [data-f-cancel]').addEventListener('click', () => {
  document.getElementById('hotelAddForm').style.display = 'none';
  document.getElementById('hotelAddTrigger').style.display = 'block';
  document.querySelectorAll('#hotelAddForm input, #hotelAddForm textarea').forEach(el => el.value='');
});
document.querySelector('#hotelAddForm [data-f-save]').addEventListener('click', async () => {
  const form = document.getElementById('hotelAddForm');
  const name = form.querySelector('[data-f-name]').value.trim();
  const address = form.querySelector('[data-f-addr]').value.trim();
  const note = form.querySelector('[data-f-note]').value.trim();

  document.getElementById('hotelAddTrigger').style.display = 'block';
  renderHotels();
});

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

function stampKey(dayIdx, spotId){ return `stamp:${dayIdx}:${spotId}`; }
async function getStamp(dayIdx, spotId){
  try{ const res = await STORAGE.get(stampKey(dayIdx, spotId)); return res.value === 'true'; }
  catch(e){ return false; }
}
async function setStamp(dayIdx, spotId, val){
  await STORAGE.set(stampKey(dayIdx, spotId), val ? 'true' : 'false');
}

function buildTab(day, idx){
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.innerHTML = `<div class="dow">${day.dow}</div><div class="dt">${day.date}</div><div class="dot"></div>`;
  tab.addEventListener('click', () => selectDay(idx));
  return tab;
}

async function renderDayPanel(panel, dayIdx){
  panel.innerHTML = '';
  const day = DAYS_META[dayIdx];
  const titleRow = document.createElement('div');
  titleRow.className = 'day-title-row';
  titleRow.innerHTML = `<div class="day-city">${day.city}</div><div class="day-date">${day.dow} ${day.date}</div>`;
  panel.appendChild(titleRow);

  if(day.flexNote){
    const note = document.createElement('div'); note.className='flex-note'; note.textContent = day.flexNote;
    panel.appendChild(note);
  }

  const sections = await getStore(`itinDay:${dayIdx}`, SEED_SECTIONS[dayIdx] || []);

  for(const section of sections){
    const labelRow = document.createElement('div'); labelRow.className='section-label-row';
    const label = document.createElement('div'); label.className='section-label'; label.textContent = section.title;
    const line = document.createElement('div'); line.className='section-line';
    const delSecBtn = document.createElement('button'); delSecBtn.className='mini-btn'; delSecBtn.textContent='remove section';
    let confirming = false, timer = null;
    delSecBtn.addEventListener('click', async () => {
      if(!confirming){
        confirming = true; delSecBtn.textContent = 'confirm?';
        timer = setTimeout(() => { confirming=false; delSecBtn.textContent='remove section'; }, 2800);
      } else {
        clearTimeout(timer);
        const updated = sections.filter(s => s.id !== section.id);
        await setStore(`itinDay:${dayIdx}`, updated);
        renderDayPanel(panel, dayIdx);
      }
    });
    labelRow.appendChild(label); labelRow.appendChild(line); labelRow.appendChild(delSecBtn);
    panel.appendChild(labelRow);

    const listEl = document.createElement('div');
    panel.appendChild(listEl);

    for(const spot of section.spots){
      const stampOn = await getStamp(dayIdx, spot.id);
      listEl.appendChild(buildEditableCard(spot, {
        showStamp: true,
        stampOn,
        onToggleStamp: async () => {
          const newVal = !(await getStamp(dayIdx, spot.id));
          await setStamp(dayIdx, spot.id, newVal);
          renderDayPanel(panel, dayIdx);
        },
        onSave: async () => { await setStore(`itinDay:${dayIdx}`, sections); },
        onDelete: async () => {
          section.spots = section.spots.filter(s => s.id !== spot.id);
          await setStore(`itinDay:${dayIdx}`, sections);
          renderDayPanel(panel, dayIdx);
        }
      }));
    }

    buildAddForm(panel, `+ Add to ${section.title}`, async (newSpot) => {
      section.spots.push(newSpot);
      await setStore(`itinDay:${dayIdx}`, sections);
      renderDayPanel(panel, dayIdx);
    });
  }

  const addSectionWrap = document.createElement('div');
  addSectionWrap.style.marginTop = '18px';
  const addSecTrigger = document.createElement('button');
  addSecTrigger.className = 'add-trigger'; addSecTrigger.textContent = '+ Add a new section';
  const addSecForm = document.createElement('div');
  addSecForm.className = 'edit-card'; addSecForm.style.display = 'none';
  addSecForm.innerHTML = '<input type="text" placeholder="Section title (e.g. Evening Plan)" data-sec-name>' +
    '<div class="row"><button class="btn-primary" data-sec-save>Add Section</button><button class="btn-ghost" data-sec-cancel>Cancel</button></div>';
  addSectionWrap.appendChild(addSecTrigger);
  addSectionWrap.appendChild(addSecForm);
  panel.appendChild(addSectionWrap);

  addSecTrigger.addEventListener('click', () => { addSecForm.style.display='block'; addSecTrigger.style.display='none'; });
  addSecForm.querySelector('[data-sec-cancel]').addEventListener('click', () => {
    addSecForm.style.display='none'; addSecTrigger.style.display='block';
  });
  addSecForm.querySelector('[data-sec-save]').addEventListener('click', async () => {
    const title = addSecForm.querySelector('[data-sec-name]').value.trim();
    if(!title) return;
    sections.push({ id: uid(), title, spots: [] });
    await setStore(`itinDay:${dayIdx}`, sections);
    renderDayPanel(panel, dayIdx);
  });
}

const catTabsEl = document.getElementById('catTabs');
const catPanelsEl = document.getElementById('catPanels');
let categories = [];
let selectedCatIdx = 0;

function placesKey(slug){ return `places:${slug}`; }

async function loadCategories(){
  categories = await getStore('places:categories', DEFAULT_CATEGORIES);
}

function renderCatTabs(){
  catTabsEl.innerHTML = '';
  categories.forEach((cat, idx) => {
    const tab = document.createElement('div');
    tab.className = 'cat-tab' + (idx===selectedCatIdx ? ' active' : '');
    tab.textContent = cat.label;
    tab.addEventListener('click', () => { selectedCatIdx = idx; renderCatTabs(); renderCatPanel(); });
    catTabsEl.appendChild(tab);
  });
  const addTab = document.createElement('div');
  addTab.className = 'cat-tab add-new';
  addTab.textContent = '+ New';
  addTab.addEventListener('click', () => {
    document.getElementById('catAddForm').style.display = 'block';
  });
  catTabsEl.appendChild(addTab);
}

document.querySelector('#catAddForm [data-cat-cancel]').addEventListener('click', () => {
  document.getElementById('catAddForm').style.display = 'none';
  document.querySelector('#catAddForm [data-cat-name]').value = '';
});
document.querySelector('#catAddForm [data-cat-save]').addEventListener('click', async () => {
  const nameInput = document.querySelector('#catAddForm [data-cat-name]');
  const label = nameInput.value.trim();
  if(!label) return;
  const slug = slugify(label) + '-' + uid().slice(0,4);
  categories.push({ slug, label });
  await setStore('places:categories', categories);
  nameInput.value = '';
  document.getElementById('catAddForm').style.display = 'none';
  selectedCatIdx = categories.length - 1;
  renderCatTabs(); renderCatPanel();
});

async function renderCatPanel(){
  catPanelsEl.innerHTML = '';
  if(categories.length === 0) return;
  const cat = categories[selectedCatIdx];
  const panel = document.createElement('div');
  panel.className = 'cat-panel active';

  const manageRow = document.createElement('div');
  manageRow.className = 'cat-manage';
  const heading = document.createElement('div');
  heading.className = 'cat-heading'; heading.textContent = cat.label;
  const renameBtn = document.createElement('button');
  renameBtn.className = 'icon-btn'; renameBtn.textContent = 'rename';
  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'icon-btn danger'; deleteBtn.textContent = 'delete category';
  manageRow.appendChild(heading); manageRow.appendChild(renameBtn); manageRow.appendChild(deleteBtn);
  panel.appendChild(manageRow);

  renameBtn.addEventListener('click', () => {
    manageRow.innerHTML = '';
    const input = document.createElement('input');
    input.type = 'text'; input.value = cat.label;
    input.style.cssText = 'flex:1; padding:8px 10px; border:1px solid var(--red); border-radius:6px; font-size:14px;';
    const saveBtn = document.createElement('button'); saveBtn.className='btn-primary'; saveBtn.textContent='Save'; saveBtn.style.flex='0 0 auto'; saveBtn.style.padding='8px 14px';
    manageRow.appendChild(input); manageRow.appendChild(saveBtn);
    saveBtn.addEventListener('click', async () => {
      const val = input.value.trim();
      if(!val) return;
      cat.label = val;
      await setStore('places:categories', categories);
      renderCatTabs(); renderCatPanel();
    });
  });

  let confirmingDelete = false, delTimer = null;
  deleteBtn.addEventListener('click', async () => {
    if(!confirmingDelete){
      confirmingDelete = true; deleteBtn.textContent = 'confirm delete?';
      delTimer = setTimeout(() => { confirmingDelete=false; deleteBtn.textContent='delete category'; }, 2800);
      return;
    }
    clearTimeout(delTimer);
    categories.splice(selectedCatIdx, 1);
    await setStore('places:categories', categories);
    selectedCatIdx = 0;
    renderCatTabs(); renderCatPanel();
  });

  const listEl = document.createElement('div');
  panel.appendChild(listEl);

  const places = await getStore(placesKey(cat.slug), DEFAULT_PLACES[cat.slug] || []);
  if(places.length === 0){
    const empty = document.createElement('div'); empty.className='empty-state';
    empty.textContent = 'No places here yet, add one below.';
    listEl.appendChild(empty);
  } else {
    places.forEach(place => {
      listEl.appendChild(buildEditableCard(place, {
        onSave: async () => { await setStore(placesKey(cat.slug), places); },
        onDelete: async () => {
          const updated = places.filter(p => p.id !== place.id);
          await setStore(placesKey(cat.slug), updated);
          renderCatPanel();
        }
      }));
    });
  }

  buildAddForm(panel, `+ Add a place to ${cat.label}`, async (newPlace) => {
    places.push(newPlace);
    await setStore(placesKey(cat.slug), places);
    renderCatPanel();
  });

  catPanelsEl.appendChild(panel);
}

async function boot(){
  await initFirebase();

  renderHotels();

  for(let i = 0; i < dayPanels.length; i++){
    await renderDayPanel(dayPanels[i], i);
  }
  selectDay(0);

  await loadCategories();
  renderCatTabs();
  renderCatPanel();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
window.addEventListener('load', boot);
</script>
